---

name: CI
on:
  pull_request:
jobs:
  ok:
    if: failure()
    runs-on: ubuntu-slim
    needs:
      - test-lint
    steps:
      - run: exit 1
  test-lint:
    name: test and lint
    strategy:
      matrix:
        go_version:
          - stable
          - oldstable
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version: ${{ matrix.go_version }}
          cache: true
      - name: test
        run: |
          go test -v -race -coverprofile=cover.out ./...
      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        if: ${{ matrix.go_version == 'stable' }}
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.65.2
      - run: aqua install
      - name: golangci-lint
        id: lint
        run: golangci-lint run --timeout=5m ./...
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ matrix.go_version == 'stable' }}
        with:
          sarif_file: golangci-lint.sarif
          category: golangci-lint
      - name: report issues
        if: steps.lint.outcome == 'failure'
        run: exit 1
